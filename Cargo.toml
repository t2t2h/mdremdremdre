[package]
name = "neteq-core"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "neteq-rs core (vendored): jitter buffer, WSOLA time-stretch, PLC, CNG"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
